<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#183153">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Five Letters">
  <title>Five Letters</title>
  <style>
:root {
  --navy: #183153;
  --ink: #1f2933;
  --muted: #6b7280;
  --line: #cbd2d9;
  --tile-bg: #ffffff;
  --correct: #2a9d8f;
  --present: #e9b949;
  --absent: #66717e;
  --key: #dce2e8;
  --panel: #f7f9fb;
  --danger: #a33d3d;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: #fff; color: var(--ink); }
body {
  min-height: 100dvh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overscroll-behavior: none;
  padding-bottom: env(safe-area-inset-bottom);
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; }

.topbar {
  min-height: 62px;
  padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
  border-bottom: 1px solid #e4e7eb;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  background: #fff;
}
.brand-wrap { text-align: center; min-width: 0; }
.brand { font-weight: 850; letter-spacing: .11em; font-size: 19px; color: var(--navy); }
.subbrand { margin-top: 2px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-button {
  width: 42px; height: 42px; border-radius: 12px; border: 1px solid #d9dee5;
  background: #fff; color: var(--navy); font-weight: 800; font-size: 20px;
}
.stats-icon { font-size: 18px; }

.game-shell {
  width: min(100%, 520px);
  min-height: calc(100dvh - 62px - env(safe-area-inset-top));
  margin: 0 auto;
  padding: 12px 10px calc(10px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  position: relative;
}

.toast {
  position: fixed;
  z-index: 30;
  top: calc(74px + env(safe-area-inset-top));
  left: 50%; transform: translateX(-50%) translateY(-10px);
  max-width: calc(100vw - 36px);
  background: #17202a; color: #fff; border-radius: 10px;
  padding: 9px 13px; font-size: 14px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .15s ease, transform .15s ease;
  box-shadow: 0 8px 22px rgba(0,0,0,.18);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.board {
  display: grid;
  grid-template-rows: repeat(6, 1fr);
  gap: 6px;
  width: min(330px, calc(100vw - 40px));
  aspect-ratio: 5 / 6;
  max-height: 380px;
}
.board-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tile {
  aspect-ratio: 1;
  border: 2px solid var(--line);
  background: var(--tile-bg);
  border-radius: 9px;
  display: grid; place-items: center;
  font-size: clamp(24px, 8vw, 34px);
  line-height: 1;
  font-weight: 850;
  text-transform: uppercase;
  color: var(--ink);
  transition: transform .12s ease, background-color .16s ease, border-color .16s ease;
}
.tile.filled { border-color: #84919d; animation: pop .08s ease; }
.tile.correct, .tile.present, .tile.absent { color: white; border-color: transparent; }
.tile.correct { background: var(--correct); }
.tile.present { background: var(--present); }
.tile.absent { background: var(--absent); }
.tile.reveal { animation: reveal .34s ease both; }

.game-actions { width: min(330px, calc(100vw - 40px)); display: flex; justify-content: center; }
.secondary-button, .primary-button {
  min-height: 42px; border-radius: 12px; padding: 9px 18px; font-weight: 800; border: 0;
}
.secondary-button { background: #fff; color: var(--danger); border: 1px solid #e2bcbc; }
.primary-button { background: var(--navy); color: #fff; width: 100%; }

.keyboard { width: 100%; margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.keyboard-row { display: flex; gap: 5px; width: 100%; justify-content: center; }
.key {
  height: clamp(45px, 7dvh, 56px);
  flex: 1 1 0;
  min-width: 0;
  border: 0;
  border-radius: 8px;
  background: var(--key);
  color: #17202a;
  font-weight: 800;
  font-size: 14px;
  padding: 0 2px;
  touch-action: manipulation;
}
.key.wide { flex: 1.45 1 0; font-size: 12px; }
.key.correct, .key.present, .key.absent { color: #fff; }
.key.correct { background: var(--correct); }
.key.present { background: var(--present); }
.key.absent { background: var(--absent); }
.key:active, .secondary-button:active, .primary-button:active, .icon-button:active { transform: scale(.97); }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(20, 30, 40, .42);
  display: grid; place-items: end center;
  padding-top: calc(24px + env(safe-area-inset-top));
}
.modal-backdrop[hidden] { display: none; }
.modal {
  width: min(100%, 520px);
  max-height: min(86dvh, 760px);
  overflow-y: auto;
  background: #fff;
  border-radius: 22px 22px 0 0;
  padding: 24px 22px calc(22px + env(safe-area-inset-bottom));
  position: relative;
  box-shadow: 0 -10px 40px rgba(0,0,0,.15);
}
.modal-close {
  position: absolute; right: 14px; top: 12px; width: 38px; height: 38px;
  border: 0; border-radius: 12px; background: #eef2f5; color: #485461; font-size: 25px;
}
.modal h2 { margin: 0 44px 14px 0; font-size: 24px; color: var(--navy); }
.modal h3 { margin: 18px 0 6px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.modal p { line-height: 1.5; }
.word-result { font-size: 36px; font-weight: 900; letter-spacing: .12em; color: var(--navy); margin: 6px 0 2px; }
.result-note { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.info-card { background: var(--panel); border: 1px solid #e2e7ec; border-radius: 14px; padding: 14px; margin: 10px 0; }
.info-label { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.info-text { line-height: 1.45; }
.api-note { color: var(--muted); font-size: 11px; margin-top: 10px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0 20px; }
.stat-box { text-align: center; background: var(--panel); border-radius: 12px; padding: 10px 4px; }
.stat-num { font-size: 24px; font-weight: 900; color: var(--navy); }
.stat-label { font-size: 10px; color: var(--muted); line-height: 1.2; margin-top: 3px; }
.dist-row { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: center; margin: 5px 0; font-size: 13px; }
.dist-track { background: #edf0f3; min-height: 22px; border-radius: 5px; overflow: hidden; }
.dist-bar { min-width: 24px; height: 22px; background: var(--navy); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; }
.help-list { padding-left: 20px; line-height: 1.55; }
.legend { display: grid; grid-template-columns: 42px 1fr; gap: 10px; align-items: center; margin: 10px 0; }
.legend-tile { width: 42px; height: 42px; border-radius: 8px; color:#fff; display:grid; place-items:center; font-weight:900; }
.legend-tile.correct { background: var(--correct); }
.legend-tile.present { background: var(--present); }
.legend-tile.absent { background: var(--absent); }

@keyframes pop { from { transform: scale(.94); } to { transform: scale(1); } }
@keyframes reveal { 0% { transform: rotateX(0); } 45% { transform: rotateX(90deg); } 55% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }

@media (max-height: 700px) {
  .topbar { min-height: 54px; padding-top: calc(5px + env(safe-area-inset-top)); padding-bottom: 5px; }
  .icon-button { width: 38px; height: 38px; }
  .game-shell { gap: 7px; padding-top: 7px; }
  .board { width: min(292px, calc(100vw - 48px)); }
  .secondary-button { min-height: 36px; padding: 6px 16px; }
  .keyboard { gap: 4px; }
  .keyboard-row { gap: 4px; }
  .key { height: 44px; }
}

@media (min-width: 700px) {
  .modal-backdrop { place-items: center; padding: 20px; }
  .modal { border-radius: 22px; max-width: 480px; }
}

  </style>
</head>
<body>
  <header class="topbar">
    <button class="icon-button" id="helpButton" aria-label="How to play">?</button>
    <div class="brand-wrap">
      <div class="brand">FIVE LETTERS</div>
      <div class="subbrand">British English · unlimited games</div>
    </div>
    <button class="icon-button stats-icon" id="statsButton" aria-label="Statistics">▥</button>
  </header>

  <main class="game-shell">
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <section id="board" class="board" aria-label="Guess board"></section>

    <div class="game-actions">
      <button id="giveUpButton" class="secondary-button">Give Up</button>
    </div>

    <section id="keyboard" class="keyboard" aria-label="On-screen keyboard"></section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="modalClose" class="modal-close" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <script type="module">
const ROWS = 6;
const COLS = 5;

function evaluateGuess(guess, answer) {
  const result = Array(COLS).fill('absent');
  const remaining = {};
  for (let i = 0; i < COLS; i++) {
    if (guess[i] === answer[i]) result[i] = 'correct';
    else remaining[answer[i]] = (remaining[answer[i]] || 0) + 1;
  }
  for (let i = 0; i < COLS; i++) {
    if (result[i] === 'correct') continue;
    const ch = guess[i];
    if ((remaining[ch] || 0) > 0) {
      result[i] = 'present';
      remaining[ch] -= 1;
    }
  }
  return result;
}

const VALID_SET = new Set(VALID_GUESSES);
const STATE_KEY = 'fiveLetters.game.v1';
const STATS_KEY = 'fiveLetters.stats.v1';
const INFO_KEY = 'fiveLetters.wordInfo.v1';
const keyRanks = { absent: 1, present: 2, correct: 3 };

const board = document.querySelector('#board');
const keyboard = document.querySelector('#keyboard');
const toast = document.querySelector('#toast');
const giveUpButton = document.querySelector('#giveUpButton');
const helpButton = document.querySelector('#helpButton');
const statsButton = document.querySelector('#statsButton');
const modalBackdrop = document.querySelector('#modalBackdrop');
const modalContent = document.querySelector('#modalContent');
const modalClose = document.querySelector('#modalClose');

let toastTimer = null;
let state = loadGame() || makeNewGame();
let stats = loadStats();
let keyStates = {};

function randomAnswer() {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return ANSWERS[arr[0] % ANSWERS.length];
}

function makeNewGame() {
  const fresh = { answer: randomAnswer(), guesses: [], current: '', status: 'playing' };
  localStorage.setItem(STATE_KEY, JSON.stringify(fresh));
  return fresh;
}

function loadGame() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STATE_KEY));
    if (!parsed || !ANSWERS.includes(parsed.answer)) return null;
    if (!Array.isArray(parsed.guesses) || typeof parsed.current !== 'string') return null;
    if (!['playing','won','lost'].includes(parsed.status)) return null;
    parsed.guesses = parsed.guesses.filter(g => typeof g === 'string' && g.length === 5).slice(0, ROWS);
    parsed.current = parsed.current.replace(/[^a-z]/g, '').slice(0, COLS);
    return parsed;
  } catch { return null; }
}

function saveGame() {
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
}

function defaultStats() {
  return { played: 0, won: 0, currentStreak: 0, bestStreak: 0, guessDist: [0,0,0,0,0,0] };
}

function loadStats() {
  try {
    const value = JSON.parse(localStorage.getItem(STATS_KEY));
    return { ...defaultStats(), ...value, guessDist: Array.isArray(value?.guessDist) ? value.guessDist.slice(0,6) : [0,0,0,0,0,0] };
  } catch { return defaultStats(); }
}

function saveStats() { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }

function buildBoard() {
  board.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'board-row';
    for (let c = 0; c < COLS; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.row = r;
      tile.dataset.col = c;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

function buildKeyboard() {
  keyboard.innerHTML = '';
  const rows = [
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['ENTER','z','x','c','v','b','n','m','BACK']
  ];
  rows.forEach(keys => {
    const row = document.createElement('div');
    row.className = 'keyboard-row';
    keys.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + ((k === 'ENTER' || k === 'BACK') ? ' wide' : '');
      btn.type = 'button';
      btn.dataset.key = k;
      btn.textContent = k === 'BACK' ? '⌫' : k;
      btn.setAttribute('aria-label', k === 'BACK' ? 'Backspace' : k === 'ENTER' ? 'Enter' : k.toUpperCase());
      btn.addEventListener('click', () => handleKey(k));
      row.appendChild(btn);
    });
    keyboard.appendChild(row);
  });
}

function recomputeKeyStates() {
  keyStates = {};
  state.guesses.forEach(guess => {
    const evaluation = evaluateGuess(guess, state.answer);
    evaluation.forEach((status, i) => {
      const letter = guess[i];
      const existing = keyStates[letter];
      if (!existing || keyRanks[status] > keyRanks[existing]) keyStates[letter] = status;
    });
  });
}

function render() {
  recomputeKeyStates();
  const tiles = [...document.querySelectorAll('.tile')];
  tiles.forEach(tile => { tile.textContent = ''; tile.className = 'tile'; });

  state.guesses.forEach((guess, r) => {
    const evaluation = evaluateGuess(guess, state.answer);
    for (let c = 0; c < COLS; c++) {
      const tile = tileAt(r,c);
      tile.textContent = guess[c].toUpperCase();
      tile.classList.add(evaluation[c]);
    }
  });

  if (state.status === 'playing' && state.guesses.length < ROWS) {
    const r = state.guesses.length;
    [...state.current].forEach((ch,c) => {
      const tile = tileAt(r,c);
      tile.textContent = ch.toUpperCase();
      tile.classList.add('filled');
    });
  }

  document.querySelectorAll('.key').forEach(key => {
    key.classList.remove('correct','present','absent');
    const letter = key.dataset.key;
    if (keyStates[letter]) key.classList.add(keyStates[letter]);
  });

  giveUpButton.textContent = state.status === 'playing' ? 'Give Up' : 'New Game';
}

function tileAt(r,c) { return document.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`); }

function handleKey(key) {
  if (state.status !== 'playing') return;
  if (key === 'ENTER') return submitGuess();
  if (key === 'BACK') {
    state.current = state.current.slice(0,-1);
    saveGame(); render(); return;
  }
  if (/^[a-z]$/.test(key) && state.current.length < COLS) {
    state.current += key;
    saveGame(); render();
  }
}

function submitGuess() {
  const guess = state.current.toLowerCase();
  if (guess.length < COLS) return showToast('Not enough letters');
  if (!VALID_SET.has(guess)) return showToast('Not in our dictionary');

  const rowIndex = state.guesses.length;
  state.guesses.push(guess);
  state.current = '';
  const won = guess === state.answer;
  const outOfTries = state.guesses.length >= ROWS;
  if (won) finishGame('won');
  else if (outOfTries) finishGame('lost');
  else saveGame();

  render();
  animateRow(rowIndex);
  if (state.status !== 'playing') setTimeout(() => showResultModal(), 430);
}

function animateRow(r) {
  for (let c = 0; c < COLS; c++) {
    const tile = tileAt(r,c);
    setTimeout(() => tile.classList.add('reveal'), c * 55);
  }
}

function finishGame(status) {
  state.status = status;
  stats.played += 1;
  if (status === 'won') {
    stats.won += 1;
    stats.currentStreak += 1;
    stats.bestStreak = Math.max(stats.bestStreak, stats.currentStreak);
    const idx = Math.max(0, Math.min(5, state.guesses.length - 1));
    stats.guessDist[idx] += 1;
  } else {
    stats.currentStreak = 0;
  }
  saveStats();
  saveGame();
}

function giveUp() {
  if (state.status !== 'playing') return startNewGame();
  if (!window.confirm('Give up and reveal the word?')) return;
  finishGame('lost');
  render();
  showResultModal(true);
}

function startNewGame() {
  closeModal();
  state = makeNewGame();
  keyStates = {};
  render();
}

function showToast(message) {
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
}

function openModal(html) {
  modalContent.innerHTML = html;
  modalBackdrop.hidden = false;
}
function closeModal() { modalBackdrop.hidden = true; }

function showHelp() {
  openModal(`
    <h2 id="modalTitle">How to play</h2>
    <p>Guess the five-letter word in six tries. You can play as many games as you like.</p>
    <div class="legend"><div class="legend-tile correct">A</div><div>The letter is correct and in the right place.</div></div>
    <div class="legend"><div class="legend-tile present">A</div><div>The letter is in the word, but in a different place.</div></div>
    <div class="legend"><div class="legend-tile absent">A</div><div>The letter is not in the word.</div></div>
    <ul class="help-list">
      <li>Answers are common five-letter words, using British spelling.</li>
      <li>The guess dictionary is wider than the answer list.</li>
      <li>Repeated letters are scored carefully, one occurrence at a time.</li>
      <li>Give Up counts as a loss.</li>
    </ul>
  `);
}

function winPercent() { return stats.played ? Math.round((stats.won / stats.played) * 100) : 0; }

function distributionHtml() {
  const max = Math.max(1, ...stats.guessDist);
  return stats.guessDist.map((n,i) => {
    const width = Math.max(10, Math.round((n/max)*100));
    return `<div class="dist-row"><div>${i+1}</div><div class="dist-track"><div class="dist-bar" style="width:${width}%">${n}</div></div></div>`;
  }).join('');
}

function showStats() {
  openModal(`
    <h2 id="modalTitle">Statistics</h2>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">${stats.played}</div><div class="stat-label">Played</div></div>
      <div class="stat-box"><div class="stat-num">${winPercent()}</div><div class="stat-label">Win %</div></div>
      <div class="stat-box"><div class="stat-num">${stats.currentStreak}</div><div class="stat-label">Current streak</div></div>
      <div class="stat-box"><div class="stat-num">${stats.bestStreak}</div><div class="stat-label">Best streak</div></div>
    </div>
    <h3>Guess distribution</h3>
    ${distributionHtml()}
  `);
}

function safeText(s) {
  if (!s) return false;
  const blocked = /\b(fuck|shit|sex|sexual|penis|vagina|porn|bitch|whore|naked)\b/i;
  return !blocked.test(s) && s.length <= 240;
}

function deriveLookupCandidates(word) {
  const c = [word];
  if (word.endsWith('ies')) c.push(word.slice(0,-3)+'y');
  if (word.endsWith('ed')) {
    c.push(word.slice(0,-2));
    c.push(word.slice(0,-1));
  }
  if (word.endsWith('s')) c.push(word.slice(0,-1));
  return [...new Set(c.filter(w => w.length >= 3))];
}

function loadInfoCache() {
  try { return JSON.parse(localStorage.getItem(INFO_KEY)) || {}; } catch { return {}; }
}
function saveInfoCache(cache) {
  try { localStorage.setItem(INFO_KEY, JSON.stringify(cache)); } catch { /* cache is optional */ }
}

async function fetchWordInfo(word) {
  const cache = loadInfoCache();
  if (cache[word]) return cache[word];

  for (const candidate of deriveLookupCandidates(word)) {
    try {
      const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(candidate)}`);
      if (!res.ok) continue;
      const data = await res.json();
      const choices = [];
      for (const entry of Array.isArray(data) ? data : []) {
        for (const meaning of entry.meanings || []) {
          for (const d of meaning.definitions || []) {
            if (safeText(d.definition)) choices.push({
              definition: d.definition,
              example: safeText(d.example) ? d.example : null,
              partOfSpeech: meaning.partOfSpeech || ''
            });
          }
        }
      }
      if (choices.length) {
        choices.sort((a,b) => {
          const ae = a.example ? 0 : 1, be = b.example ? 0 : 1;
          return ae - be || a.definition.length - b.definition.length;
        });
        const best = choices[0];
        const info = {
          definition: best.definition,
          example: best.example || `We used the word “${word}” in a sentence today.`,
          partOfSpeech: best.partOfSpeech
        };
        cache[word] = info; saveInfoCache(cache); return info;
      }
    } catch { /* try a derived form */ }
  }
  return {
    definition: 'A dictionary definition could not be loaded right now.',
    example: `We used the word “${word}” in a sentence today.`,
    partOfSpeech: ''
  };
}

async function showResultModal(gaveUp = false) {
  const answer = state.answer;
  const won = state.status === 'won';
  const resultText = won ? `Solved in ${state.guesses.length}/6` : (gaveUp ? 'You gave up' : 'No more tries');
  openModal(`
    <h2 id="modalTitle">${won ? 'Well done!' : 'Answer revealed'}</h2>
    <div class="word-result">${answer.toUpperCase()}</div>
    <div class="result-note">${resultText}</div>
    <div class="info-card"><div class="info-label">Meaning</div><div id="meaningText" class="info-text">Looking up meaning…</div></div>
    <div class="info-card"><div class="info-label">Example</div><div id="exampleText" class="info-text">Looking up example…</div></div>
    <button id="newGameFromModal" class="primary-button">New Game</button>
    <div class="api-note">Dictionary information is loaded from Free Dictionary API when internet access is available.</div>
  `);
  document.querySelector('#newGameFromModal').addEventListener('click', startNewGame);
  const info = await fetchWordInfo(answer);
  const meaning = document.querySelector('#meaningText');
  const example = document.querySelector('#exampleText');
  if (meaning) meaning.textContent = (info.partOfSpeech ? `${info.partOfSpeech}: ` : '') + info.definition;
  if (example) example.textContent = info.example;
}

giveUpButton.addEventListener('click', giveUp);
helpButton.addEventListener('click', showHelp);
statsButton.addEventListener('click', showStats);
modalClose.addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', e => { if (e.target === modalBackdrop) closeModal(); });

buildBoard();
buildKeyboard();
render();

if (state.status !== 'playing') setTimeout(() => showResultModal(false), 250);

  </script>
</body>
